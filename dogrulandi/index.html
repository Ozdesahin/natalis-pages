<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>E-postan doğrulandı · Natalis</title>
<style>
  :root{--navy:#0E1530;--card:#17214A;--line:#2C3870;--gold:#C9A35C;--cream:#F3EBDD;--muted:#B8B2C8}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#1B2760 0%,var(--navy) 60%);
    color:var(--cream);font-family:Georgia,"Times New Roman",serif;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .stars{position:fixed;inset:0;pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%,#fff8 50%,transparent 51%),
      radial-gradient(1px 1px at 78% 12%,#fff7 50%,transparent 51%),
      radial-gradient(1.5px 1.5px at 88% 62%,#C9A35C99 50%,transparent 51%),
      radial-gradient(1px 1px at 22% 74%,#fff6 50%,transparent 51%),
      radial-gradient(1px 1px at 55% 88%,#fff6 50%,transparent 51%),
      radial-gradient(1px 1px at 40% 8%,#fff6 50%,transparent 51%);}
  main{position:relative;width:100%;max-width:460px;text-align:center}
  .brand{letter-spacing:.42em;font-size:15px;color:var(--gold);margin-bottom:28px;padding-left:.42em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:40px 28px 34px}
  .moon{width:64px;height:64px;margin:0 auto 22px;border-radius:50%;
    border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center}
  .moon svg{width:30px;height:30px;stroke:var(--gold);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  h1{font-size:26px;font-weight:400;margin:0 0 12px}
  p{margin:0 0 10px;line-height:1.6;color:var(--cream);font-size:16.5px}
  .tip{color:var(--muted);font-size:14.5px;margin-top:18px}
  hr{border:0;border-top:1px solid var(--line);margin:26px 0 20px}
  .en{color:var(--muted);font-size:14.5px}
  .en b{color:var(--cream);font-weight:400}
</style>
</head>
<body>
<div class="stars"></div>
<main>
  <div class="brand">NATALIS</div>
  <div class="card">
    <div class="moon"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1>E-postan doğrulandı</h1>
    <p>Hesabın hazır. Natalis uygulamasına dönüp giriş yapabilirsin.</p>
    <p class="tip">Bu sayfayı kapatabilirsin. Gökyüzü seni bekliyor ✨</p>
    <hr>
    <p class="en"><b>Your email is verified.</b><br>Head back to the Natalis app and sign in.</p>
  </div>
</main>
</body>
</html>
